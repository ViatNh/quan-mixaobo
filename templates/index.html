<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Quán Mì Xào Bò</title>
<style>
:root {
  --red: #c0392b; --red-dark: #a93226;
  --green: #27ae60; --green-dark: #219a52;
  --orange: #e67e22;
  --bg: #faf7f2; --card: #fff; --text: #2d3436;
  --muted: #636e72; --border: #e8e4df;
  --shadow: 0 1px 3px rgba(0,0,0,.06);
  --radius: 12px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}

/* Nav */
.nav{background:var(--card);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:20}
.nav-brand{font-size:17px;font-weight:700;color:var(--red);display:flex;align-items:center;gap:6px}
.nav-brand span{opacity:.6;font-weight:400;font-size:13px}
.nav-actions{display:flex;gap:6px}
.nav-btn{padding:6px 14px;border:1.5px solid var(--border);border-radius:8px;background:var(--card);font-size:13px;font-weight:600;cursor:pointer;color:var(--text);transition:.15s}
.nav-btn:hover{background:var(--bg)}
.nav-btn.active{background:var(--red);color:#fff;border-color:var(--red)}

/* Cards */
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin:10px 12px;box-shadow:var(--shadow);border:1px solid var(--border)}

/* Setup */
.setup-wrap{max-width:400px;margin:40px auto;padding:20px}
.setup-wrap h2{font-size:22px;text-align:center;color:var(--red);margin-bottom:4px}
.setup-wrap .sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:5px;color:var(--text)}
.field input{width:100%;padding:12px;border:1.5px solid var(--border);border-radius:10px;font-size:20px;text-align:center;letter-spacing:6px;outline:none;background:var(--bg)}
.field input:focus{border-color:var(--red);background:var(--card)}
.field .hint{font-size:12px;color:var(--muted);margin-top:3px;text-align:center}
.err{color:#d63031;font-size:13px;text-align:center;margin-top:10px}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;transition:.15s;text-align:center}
.btn:active{transform:scale(.98)}
.btn-red{background:var(--red);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-outline{padding:10px 18px;border:1.5px solid var(--border);border-radius:10px;background:var(--card);font-size:14px;font-weight:600;cursor:pointer;width:auto}

/* Gate */
.gate-wrap{max-width:360px;margin:60px auto;padding:20px;text-align:center}
.gate-wrap h2{font-size:24px;margin-bottom:6px}
.gate-wrap .sub{color:var(--muted);font-size:14px;margin-bottom:18px}
.gate-wrap input{width:100%;padding:14px;border:1.5px solid var(--border);border-radius:12px;font-size:26px;text-align:center;letter-spacing:10px;outline:none;max-width:220px;margin:0 auto 16px;display:block;background:var(--bg)}
.gate-wrap input:focus{border-color:var(--red);background:var(--card)}

/* Menu grid (customer) */
.menu-list{display:flex;flex-direction:column;gap:8px}
.menu-row{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;display:flex;align-items:center;gap:10px}
.menu-row .info{flex:1;min-width:0}
.menu-row .name{font-size:15px;font-weight:600}
.menu-row .price{font-size:13px;color:var(--muted);margin-top:1px}
.menu-row .qty{display:flex;align-items:center;gap:6px;flex-shrink:0}
.qty-btn{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--red);background:var(--card);color:var(--red);font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;line-height:1}
.qty-btn:active{background:var(--red);color:#fff}
.qty-count{font-size:16px;font-weight:700;min-width:20px;text-align:center}
.item-note{margin-top:6px;display:none}
.item-note.visible{display:block}
.item-note input{width:100%;padding:8px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;outline:none;background:var(--bg)}
.item-note input:focus{border-color:var(--red);background:var(--card)}

/* Order form */
.order-form{padding:0 12px 16px;display:flex;flex-direction:column;gap:8px}
.order-form input{padding:12px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;outline:none;background:var(--card)}
.order-form input:focus{border-color:var(--red)}
.table-badge{background:#fff3cd;padding:8px 12px;border-radius:8px;font-size:14px;font-weight:600;text-align:center;color:#856404}
.submit-btn{padding:16px;background:var(--red);color:#fff;font-size:18px;font-weight:700;border-radius:12px}
.submit-btn .total{font-size:12px;opacity:.85}

/* Toast */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:14px 24px;border-radius:12px;font-size:15px;font-weight:600;z-index:100;animation:toastAnim 3s forwards;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.15)}
@keyframes toastAnim{0%{opacity:0;transform:translateX(-50%) translateY(-12px)}15%{opacity:1;transform:translateX(-50%) translateY(0)}70%{opacity:1}100%{opacity:0}}

/* Bep */
.bep-stats{display:flex;justify-content:space-between;align-items:center;padding:8px 12px}
.bep-title{font-size:16px;font-weight:700;color:var(--red)}
.badges{display:flex;gap:6px}
.badge{padding:5px 12px;border-radius:14px;font-size:13px;font-weight:600}
.badge-wait{background:#ffeaa7;color:#d63031}
.badge-done{background:#dfe6e9;color:#636e72}

.order-card{background:var(--card);border-radius:var(--radius);padding:14px;margin:0 12px 10px;box-shadow:var(--shadow);border:1px solid var(--border);border-left:5px solid var(--orange);transition:.3s}
.order-card.new{border-left-color:#d63031;animation:glow 1.2s ease}
.order-card.done{border-left-color:var(--green);opacity:.65}
@keyframes glow{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:0 3px 14px rgba(214,48,49,.25)}}

.oc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.oc-id{font-size:18px;font-weight:800;color:var(--red)}
.oc-customer{font-size:15px;font-weight:600}
.oc-time{font-size:11px;color:var(--muted)}
.oc-items{list-style:none;padding:2px 0;margin:4px 0}
.oc-items li{font-size:20px;font-weight:700;padding:4px 0;display:flex;justify-content:space-between;align-items:center}
.oc-qty{background:#d63031;color:#fff;padding:3px 12px;border-radius:8px;font-size:18px;font-weight:800}
.oc-note{display:inline-block;font-size:12px;color:#e17055;background:#fff5f5;padding:2px 8px;border-radius:6px;margin-left:6px;font-weight:500}
.oc-done-btn{display:block;width:100%;padding:14px;background:var(--green);color:#fff;font-size:18px;font-weight:700;border:none;border-radius:10px;cursor:pointer;margin-top:8px}
.oc-done-btn:active{transform:scale(.98)}

.divider{padding:6px 0;text-align:center;color:var(--muted);font-size:13px;font-weight:600}
.empty{text-align:center;padding:36px 20px;color:#bbb;font-size:16px;font-weight:500}

/* Admin */
.admin-tabs{display:flex;gap:0;margin:10px 12px;border-radius:10px;overflow:hidden;border:1.5px solid var(--border)}
.admin-tab{flex:1;padding:10px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;background:var(--card);border:none;transition:.15s;color:var(--text)}
.admin-tab.active{background:var(--red);color:#fff}
.admin-header{display:flex;justify-content:space-between;align-items:center;padding:0 12px;margin-bottom:8px}
.admin-date{font-size:14px;font-weight:600;color:var(--muted)}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 12px 10px}
.stat{background:var(--card);border-radius:10px;padding:14px;text-align:center;border:1px solid var(--border)}
.stat .val{font-size:24px;font-weight:800;color:var(--red)}
.stat .lbl{font-size:11px;color:var(--muted);margin-top:2px}

.chart{margin:0 12px}
.bar{margin-bottom:7px}
.bar-label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
.bar-track{height:22px;background:#eee;border-radius:10px;overflow:hidden}
.bar-fill{height:100%;background:var(--red);border-radius:10px;display:flex;align-items:center;padding-left:8px;font-size:11px;color:#fff;font-weight:600;min-width:36px;transition:width .4s}
.bar-fill.top{background:#d63031}

/* Bills */
.bill-row{display:flex;align-items:center;gap:10px;padding:12px;margin:8px 12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius)}
.bill-info{flex:1}
.bill-name{font-size:15px;font-weight:600}
.bill-meta{font-size:12px;color:var(--muted)}
.bill-amount{font-size:18px;font-weight:800;color:var(--red);white-space:nowrap}
.bill-pay{padding:8px 16px;background:var(--green);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.bill-pay:active{transform:scale(.97)}

/* Menu editor */
.menu-editor{margin:0 12px}
.me-table{width:100%;border-collapse:collapse}
.me-table th{text-align:left;padding:8px 6px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border);font-weight:600}
.me-table td{padding:10px 6px;border-bottom:1px solid var(--border);font-size:14px}
.me-name{font-weight:600}
.me-price{color:var(--red);font-weight:600}
.me-actions{display:flex;gap:4px}
.me-btn{padding:4px 10px;border:1px solid var(--border);border-radius:6px;background:var(--card);font-size:12px;cursor:pointer;font-weight:600}
.me-btn.edit{color:var(--orange);border-color:var(--orange)}
.me-btn.toggle{color:var(--green);border-color:var(--green)}
.me-btn.del{color:#d63031;border-color:#d63031}
.me-add{display:flex;gap:8px;margin-top:12px}
.me-add input{padding:10px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;flex:1;outline:none}
.me-add input:focus{border-color:var(--red)}
.me-add button{padding:10px 16px;background:var(--red);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;white-space:nowrap}

/* Settings */
.actions-list{padding:0 12px;display:flex;flex-direction:column;gap:8px;margin-top:12px}
.act-btn{padding:12px;border:1.5px solid var(--border);border-radius:10px;background:var(--card);font-size:14px;font-weight:600;cursor:pointer;text-align:left;color:var(--text);transition:.15s}
.act-btn:hover{background:var(--bg)}
.act-btn.danger{color:#d63031;border-color:#fce4e4}

.note-box{background:#fff8e1;padding:12px 14px;border-radius:10px;font-size:12px;color:#856404;margin:12px;line-height:1.6;border:1px solid #ffe082}

@media(min-width:768px){
  .menu-list,.order-form{max-width:500px;margin:0 auto}
  #bep-view,#admin-view{max-width:640px;margin:0 auto}
  .stats{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>

<!-- Nav -->
<nav class="nav">
  <div class="nav-brand">🍳 Quán Mì Xào Bò <span>· Mẹ nấu ngon</span></div>
  <div class="nav-actions">
    <button class="nav-btn" onclick="navTo('khach')" id="navKhach">Thực đơn</button>
    <button class="nav-btn" onclick="navTo('bep')" id="navBep">Bếp</button>
    <button class="nav-btn" onclick="navTo('admin')" id="navAdmin">Quản lý</button>
  </div>
</nav>

<!-- Setup -->
<div id="setupView" class="setup-wrap hidden">
  <h2>Thiết lập ban đầu</h2>
  <p class="sub">Chào mừng! Hãy đặt mã PIN bảo vệ cho quán.</p>
  <div class="field"><label>Mã BẾP (4 chữ số)</label><input type="password" id="setupBep" maxlength="4" inputmode="numeric" placeholder="····"><span class="hint">Cho mẹ mở màn hình bếp</span></div>
  <div class="field"><label>Mã QUẢN LÝ (6 chữ số)</label><input type="password" id="setupAdmin" maxlength="6" inputmode="numeric" placeholder="······"><span class="hint">Cho anh xem thống kê & cài đặt</span></div>
  <button class="btn btn-red" onclick="doSetup()">Lưu & bắt đầu</button>
  <div class="err" id="setupErr"></div>
</div>

<!-- Gate -->
<div id="gateView" class="gate-wrap hidden">
  <h2 id="gateTitle">🔐</h2>
  <p class="sub" id="gateSub"></p>
  <input type="password" id="gatePin" maxlength="6" inputmode="numeric" placeholder="······">
  <div class="err" id="gateErr"></div>
  <button class="btn btn-red" onclick="checkPin()">Mở khóa</button>
</div>

<!-- Customer -->
<div id="customerView">
  <div class="card"><div class="menu-list" id="menuGrid"></div></div>
  <div class="card hidden" id="tableBadge"></div>
  <div class="order-form">
    <input type="text" id="custName" placeholder="Tên của bạn" autocomplete="off">
    <button class="btn btn-red submit-btn" onclick="placeOrder()">
      Gửi đơn <span class="total" id="orderSummary">— 0đ</span>
    </button>
  </div>
  <div id="toasts"></div>
</div>

<!-- Bep -->
<div id="bepView" class="hidden">
  <div class="bep-stats">
    <div class="bep-title">Đơn đang chờ</div>
    <div class="badges">
      <span class="badge badge-wait" id="waitCount">0</span>
      <span class="badge badge-done" id="doneCount">0</span>
      <button class="nav-btn" onclick="doLogout()" style="margin-left:4px">Thoát</button>
    </div>
  </div>
  <div id="waitOrders"></div>
  <div class="divider hidden" id="doneLabel">— Đã xong —</div>
  <div id="doneOrders"></div>
</div>

<!-- Admin -->
<div id="adminView" class="hidden">
  <div class="admin-header"><div class="admin-date" id="adDate"></div></div>
  <div class="admin-tabs">
    <button class="admin-tab active" onclick="adTab('dash')">Tổng quan</button>
    <button class="admin-tab" onclick="adTab('bills')">Thanh toán</button>
    <button class="admin-tab" onclick="adTab('menu')">Thực đơn</button>
    <button class="admin-tab" onclick="adTab('settings')">Cài đặt</button>
  </div>
  <div id="adDash"><div class="stats" id="statGrid"></div><div class="card chart"><b>Món bán chạy</b><div id="topItems" style="margin-top:10px"></div></div><div class="card chart"><b>7 ngày qua</b><div id="weekStats" style="margin-top:10px"></div></div></div>
  <div id="adBills" class="hidden"><div id="billList"></div></div>
  <div id="adMenu" class="hidden"><div class="menu-editor" id="menuEditor"></div></div>
  <div id="adSettings" class="hidden">
    <div class="actions-list">
      <button class="act-btn" onclick="chPin('bep')">Đổi mã BẾP (4 số)</button>
      <button class="act-btn" onclick="chPin('admin')">Đổi mã quản lý (6 số)</button>
      <button class="act-btn" onclick="doExport()">Xuất CSV</button>
      <button class="act-btn danger" onclick="doReset()">Xoá dữ liệu hôm nay</button>
    </div>
    <div class="note-box">PIN được mã hoá SHA-256 trên máy chủ. Đổi PIN ở đây áp dụng cho <b>tất cả thiết bị</b>.</div>
  </div>
</div>

<script>
// ═══ API ═══
async function api(u, o={}) {
  const r = await fetch(u, {credentials:'same-origin', headers:{'Content-Type':'application/json'}, ...o});
  return r.json();
}

// ═══ STATE ═══
let menu=[], cart={}, mode='khach', adTabName='dash';
const P = new URLSearchParams(location.search), tbl = P.get('ban')||'';

// ═══ INIT ═══
async function init() {
  const st = await api('/api/setup/status');
  if (st.needs_setup) { showView('setup'); return; }

  menu = await api('/api/menu');
  menu.forEach(m => cart[m.id]=0);
  renderCustomer();

  // Persistent login — check existing session
  const me = await api('/api/auth/me');
  const hash = location.hash.replace('#','');

  if (hash==='bep' && me.bep) { showView('bep'); renderBep(); return; }
  if (hash==='admin' && me.admin) { showView('admin'); renderAdmin(); return; }

  if (hash==='bep') showGate('bep');
  else if (hash==='admin') showGate('admin');
  else showView('khach');

  setInterval(() => { if (mode==='bep') renderBep(); }, 5000);
}

function showView(v) {
  mode = v;
  ['customerView','bepView','adminView','gateView','setupView'].forEach(id => document.getElementById(id).classList.add('hidden'));
  if (v==='khach') document.getElementById('customerView').classList.remove('hidden');
  else if (v==='bep') document.getElementById('bepView').classList.remove('hidden');
  else if (v==='admin') document.getElementById('adminView').classList.remove('hidden');
  // Nav highlight
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  if (v==='khach') document.getElementById('navKhach').classList.add('active');
  else if (v==='bep') document.getElementById('navBep').classList.add('active');
  else if (v==='admin') document.getElementById('navAdmin').classList.add('active');
}

function navTo(v) {
  if (v==='khach') { location.hash=''; showView('khach'); }
  else if (v==='bep') {
    api('/api/auth/me').then(me => {
      if (me.bep) { location.hash='bep'; showView('bep'); renderBep(); }
      else showGate('bep');
    });
  } else if (v==='admin') {
    api('/api/auth/me').then(me => {
      if (me.admin) { location.hash='admin'; showView('admin'); renderAdmin(); }
      else showGate('admin');
    });
  }
}

// ═══ SETUP ═══
async function doSetup() {
  const b = document.getElementById('setupBep').value.trim();
  const a = document.getElementById('setupAdmin').value.trim();
  const r = await api('/api/setup',{method:'POST',body:JSON.stringify({bep_pin:b,admin_pin:a})});
  if (r.ok) { document.getElementById('setupBep').value=''; document.getElementById('setupAdmin').value=''; init(); }
  else document.getElementById('setupErr').textContent = r.error||'Lỗi';
}

// ═══ GATE ═══
let gt='';
function showGate(t) {
  gt=t; showView('gate');
  document.getElementById('gateTitle').textContent = t==='bep'?'Bếp':'Quản lý';
  document.getElementById('gateSub').textContent = t==='bep'?'Nhập mã 4 số':'Nhập mã 6 số';
  document.getElementById('gatePin').value='';
  document.getElementById('gatePin').maxLength = t==='bep'?4:6;
  document.getElementById('gateErr').textContent='';
  document.getElementById('gatePin').focus();
}
async function checkPin() {
  const p = document.getElementById('gatePin').value;
  const u = gt==='bep'?'/api/auth/bep':'/api/auth/admin';
  const r = await api(u,{method:'POST',body:JSON.stringify({pin:p})});
  if (r.ok) { location.hash=gt; showView(gt); if (gt==='bep') renderBep(); else renderAdmin(); }
  else { document.getElementById('gateErr').textContent='Sai mã PIN'; document.getElementById('gatePin').value=''; }
}
async function doLogout() {
  await api('/api/auth/logout',{method:'POST'});
  location.hash=''; showView('khach');
}

// ═══ CUSTOMER ═══
function renderCustomer() {
  const active = menu.filter(m => m.active!==0);
  document.getElementById('menuGrid').innerHTML = active.map(m =>
    `<div class="menu-row">
      <div class="info"><div class="name">${m.name}</div><div class="price">${m.price.toLocaleString('vi')}đ</div></div>
      <div class="qty">
        <button class="qty-btn" onclick="chg(${m.id},-1)">−</button>
        <span class="qty-count" id="q${m.id}">0</span>
        <button class="qty-btn" onclick="chg(${m.id},1)">+</button>
      </div>
    </div>
    <div class="item-note" id="nw${m.id}"><input id="n${m.id}" placeholder="Ghi chú món này..." autocomplete="off"></div>`
  ).join('');

  if (tbl) {
    document.getElementById('custName').value = 'Bàn '+tbl;
    document.getElementById('tableBadge').textContent = '📍 Bàn '+tbl;
    document.getElementById('tableBadge').classList.remove('hidden');
  }
  updateTotal();
}

function chg(id,d) {
  cart[id]=Math.max(0,(cart[id]||0)+d);
  document.getElementById('q'+id).textContent=cart[id];
  document.getElementById('nw'+id).classList.toggle('visible',cart[id]>0);
  if (cart[id]===0) document.getElementById('n'+id).value='';
  updateTotal();
}

function updateTotal() {
  let c=0,t=0;
  menu.filter(m=>m.active!==0).forEach(m=>{c+=cart[m.id];t+=cart[m.id]*m.price;});
  document.getElementById('orderSummary').textContent = c?`${c} món · ${t.toLocaleString('vi')}đ`:'— 0đ';
}

async function placeOrder() {
  const name = document.getElementById('custName').value.trim();
  if (!name) return toast('Vui lòng nhập tên','err');
  const items = [];
  menu.filter(m=>m.active!==0).forEach(m=>{
    if (cart[m.id]>0) items.push({menu_item_id:m.id,quantity:cart[m.id],note:document.getElementById('n'+m.id).value.trim()});
  });
  if (!items.length) return toast('Chọn ít nhất 1 món','err');
  const r = await api('/api/orders',{method:'POST',body:JSON.stringify({customer_name:name,table_number:tbl,items})});
  if (r.ok) {
    menu.forEach(m=>{cart[m.id]=0;document.getElementById('q'+m.id).textContent=0;document.getElementById('nw'+m.id).classList.remove('visible');document.getElementById('n'+m.id).value='';});
    document.getElementById('custName').value = tbl?'Bàn '+tbl:'';
    updateTotal();
    toast(`Đã gửi đơn #${r.order_id}`);
  } else toast(r.error||'Lỗi','err');
}

function toast(m,t) {
  const e=document.createElement('div');e.className='toast';
  if (t==='err') e.style.background='#d63031';
  e.textContent=m;document.getElementById('toasts').appendChild(e);
  setTimeout(()=>e.remove(),3000);
}

// ═══ BEP ═══
async function renderBep() {
  const w = await api('/api/orders?status=waiting');
  const d = await api('/api/orders?status=done');
  document.getElementById('waitCount').textContent = w.length+' đơn';
  document.getElementById('doneCount').textContent = d.length+' xong';
  document.getElementById('doneLabel').classList.toggle('hidden',!d.length);
  document.getElementById('waitOrders').innerHTML = w.length ? w.map(o=>oc(o,true)).join('') : '<div class="empty">Hết đơn — mẹ nghỉ tay ☕</div>';
  document.getElementById('doneOrders').innerHTML = d.map(o=>oc(o,false)).join('');
}

function oc(o,waiting) {
  const ts = new Date(o.created_at+'Z'), ago = Math.floor((Date.now()-ts)/1000);
  const as = ago<60?`${ago}s`:`${Math.floor(ago/60)}ph`;
  return `<div class="order-card ${waiting&&ago<15?'new':''} ${!waiting?'done':''}">
    <div class="oc-head">
      <span class="oc-id">#${o.id}</span>
      <span class="oc-customer">${o.customer_name}${o.table_number?' · Bàn '+o.table_number:''}</span>
      <span class="oc-time">${o.created_at.slice(11,16)} · ${as}</span>
    </div>
    <ul class="oc-items">${o.items.map(i=>`<li><span>${i.menu_name}${i.note?` <span class="oc-note">${i.note}</span>`:''}</span><span class="oc-qty">×${i.quantity}</span></li>`).join('')}</ul>
    ${waiting?`<button class="oc-done-btn" onclick="markDone(${o.id})">Xong — đơn tiếp</button>`:''}
  </div>`;
}

async function markDone(id) {
  await api(`/api/orders/${id}/status`,{method:'PUT',body:JSON.stringify({status:'done'})});
  renderBep();
}

// ═══ ADMIN ═══
async function renderAdmin() {
  document.getElementById('adDate').textContent = new Date().toLocaleDateString('vi-VN',{weekday:'long',day:'numeric',month:'numeric',year:'numeric'});
  adTab(adTabName);
}

function adTab(t) {
  adTabName=t;
  document.querySelectorAll('.admin-tab').forEach((b,i)=>{
    const tabs=['dash','bills','menu','settings'];
    b.classList.toggle('active',tabs[i]===t);
  });
  ['adDash','adBills','adMenu','adSettings'].forEach(id=>document.getElementById(id).classList.add('hidden'));
  document.getElementById('ad'+(t.charAt(0).toUpperCase()+t.slice(1))).classList.remove('hidden');
  if (t==='dash') loadDash();
  if (t==='bills') loadBills();
  if (t==='menu') loadMenuEdit();
}

async function loadDash() {
  const s = await api('/api/stats/today');
  if (s.error) return;
  document.getElementById('statGrid').innerHTML = `
    <div class="stat"><div class="val">${s.total_orders}</div><div class="lbl">Tổng đơn</div></div>
    <div class="stat"><div class="val">${s.total_items}</div><div class="lbl">Món đã làm</div></div>
    <div class="stat"><div class="val">${s.paid_revenue.toLocaleString('vi')}đ</div><div class="lbl">Doanh thu</div></div>
    <div class="stat"><div class="val">${s.avg_per_order.toLocaleString('vi')}đ</div><div class="lbl">TB / đơn</div></div>`;
  const top=s.top_items||[],mx=top[0]?top[0].qty:1;
  document.getElementById('topItems').innerHTML = top.length ? top.map((t,i)=>`<div class="bar"><div class="bar-label"><span>${t.name}</span><span>${t.qty} phần</span></div><div class="bar-track"><div class="bar-fill ${i===0?'top':''}" style="width:${Math.max(5,t.qty/mx*100)}%">${t.qty}</div></div></div>`).join('') : '<div class="empty">Chưa có dữ liệu</div>';
  const w = await api('/api/stats/weekly');
  const mr = Math.max(1,...w.map(x=>x.revenue));
  document.getElementById('weekStats').innerHTML = w.map(x=>{const dn=new Date(x.date).toLocaleDateString('vi-VN',{weekday:'short'});return `<div class="bar"><div class="bar-label"><span>${dn} ${x.date.slice(5)}</span><span>${x.orders} đơn · ${x.revenue.toLocaleString('vi')}đ</span></div><div class="bar-track"><div class="bar-fill" style="width:${Math.max(3,x.revenue/mr*100)}%">${x.revenue.toLocaleString('vi')}đ</div></div></div>`;}).join('');
}

async function loadBills() {
  const b = await api('/api/stats/pending_payments');
  document.getElementById('billList').innerHTML = b.length ? b.map(x=>`<div class="bill-row"><div class="bill-info"><div class="bill-name">${x.customer_name}${x.table_number?' · Bàn '+x.table_number:''}</div><div class="bill-meta">#${x.id} · ${x.created_at.slice(11,16)}</div></div><div class="bill-amount">${x.total_amount.toLocaleString('vi')}đ</div><button class="bill-pay" onclick="doPay(${x.id})">Đã trả</button></div>`).join('') : '<div class="empty">Không có đơn chờ thanh toán ✨</div>';
}
async function doPay(id) { await api(`/api/orders/${id}/status`,{method:'PUT',body:JSON.stringify({status:'paid'})}); loadBills(); loadDash(); toast(`Đã thanh toán #${id}`); }

// ═══ MENU EDIT ═══
async function loadMenuEdit() {
  const m = await api('/api/menu');
  document.getElementById('menuEditor').innerHTML = `
    <table class="me-table"><thead><tr><th>Món</th><th>Giá</th><th></th></tr></thead>
    <tbody>${m.map(x=>`<tr>
      <td class="me-name">${x.name} ${x.active?'' : '<span style="color:#d63031;font-size:11px">(ẩn)</span>'}</td>
      <td class="me-price">${x.price.toLocaleString('vi')}đ</td>
      <td class="me-actions">
        <button class="me-btn edit" onclick="editMenuItem(${x.id},'${x.name.replace(/'/g,"\\'")}',${x.price})">Sửa</button>
        <button class="me-btn toggle" onclick="toggleMenuItem(${x.id},${x.active?0:1})">${x.active?'Ẩn':'Hiện'}</button>
        <button class="me-btn del" onclick="delMenuItem(${x.id})">Xoá</button>
      </td>
    </tr>`).join('')}</tbody></table>
    <div class="me-add">
      <input id="newName" placeholder="Tên món mới">
      <input id="newPrice" placeholder="Giá" type="number" style="max-width:100px">
      <button onclick="addMenuItem()">Thêm</button>
    </div>`;
}

async function editMenuItem(id,name,price) {
  const nn=prompt('Tên món:',name); if (!nn) return;
  const np=prompt('Giá (VNĐ):',price); if (!np||isNaN(np)) return;
  const r = await api(`/api/menu/${id}`,{method:'PUT',body:JSON.stringify({name:nn,price:parseInt(np),active:1})});
  if (r.ok) { loadMenuEdit(); renderCustomer(); toast('Đã cập nhật'); }
}
async function toggleMenuItem(id,active) {
  const m = menu.find(x=>x.id===id);
  if (!m) return;
  const r = await api(`/api/menu/${id}`,{method:'PUT',body:JSON.stringify({name:m.name,price:m.price,active})});
  if (r.ok) { loadMenuEdit(); renderCustomer(); }
}
async function delMenuItem(id) {
  if (!confirm('Xoá món này?')) return;
  const r = await api(`/api/menu/${id}`,{method:'DELETE'});
  if (r.ok) { menu=menu.filter(x=>x.id!==id); loadMenuEdit(); renderCustomer(); }
}
async function addMenuItem() {
  const n=document.getElementById('newName').value.trim();
  const p=document.getElementById('newPrice').value;
  if (!n||!p||isNaN(p)) return toast('Nhập tên và giá','err');
  const r = await api('/api/menu',{method:'POST',body:JSON.stringify({name:n,price:parseInt(p)})});
  if (r.ok) { menu=await api('/api/menu'); menu.forEach(m=>{if(!(m.id in cart)) cart[m.id]=0;}); loadMenuEdit(); renderCustomer(); toast('Đã thêm món'); }
}

// ═══ SETTINGS ═══
async function chPin(role) {
  const len=role==='bep'?4:6;
  const np=prompt(`Mã ${role==='bep'?'BẾP':'quản lý'} mới (${len} số):`);
  if (!np||!new RegExp(`^\\d{${len}}$`).test(np)) return toast(`Phải đúng ${len} chữ số`,'err');
  const r = await api(`/api/config/pin/${role}`,{method:'PUT',body:JSON.stringify({pin:np})});
  toast(r.ok?'Đã đổi mã':r.error||'Lỗi', r.ok?'':'err');
}
async function doExport() {
  const o=await api('/api/orders');
  const rows=[['ID','Khách','Bàn','Món','SL','Giá','Ghi chú','TG','Trạng thái','Tổng']];
  o.forEach(x=>x.items.forEach(i=>rows.push([x.id,x.customer_name,x.table_number,i.menu_name,i.quantity,i.price,i.note||'',x.created_at,x.status,x.total_amount])));
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const b=new Blob(['\ufeff'+csv],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mixaobo-'+new Date().toISOString().slice(0,10)+'.csv';a.click();
}
async function doReset() {
  if (!confirm('Xoá tất cả đơn hàng hôm nay?')) return;
  const r = await api('/api/reset/today',{method:'POST'});
  if (r.ok) toast('Đã xoá');
}

// Keyboard
document.getElementById('gatePin').addEventListener('keydown',e=>{if(e.key==='Enter')checkPin();});
document.getElementById('setupBep').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('setupAdmin').focus();});
document.getElementById('setupAdmin').addEventListener('keydown',e=>{if(e.key==='Enter')doSetup();});

init();
</script>
